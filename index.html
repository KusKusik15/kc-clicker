<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>KC Clicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header>
        <div class="balance">
            <span id="coins">0</span>
            <span class="coin-icon">🪙</span>
        </div>
        <div class="stats">
            <div>⚡ <span id="energy">1000</span>/<span id="maxEnergy">1000</span></div>
            <div>💪 +<span id="clickPower">1</span> за клик</div>
        </div>
    </header>

    <main>
        <button id="tapButton">
            <div class="coin-big">🪙</div>
            <div class="tap-hint">ТАПАЙ</div>
        </button>
    </main>

    <section id="upgrades">
        <h2>🛒 Магазин</h2>
        <div id="upgradesList"></div>
    </section>
</div>

<div id="energyModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-icon">⚡</div>
        <h3>Энергия закончилась!</h3>
        <p>Подожди немного или посмотри рекламу, чтобы сразу восстановить полный запас.</p>
        <button id="watchAdBtn" class="modal-btn-primary">
            📺 Смотреть рекламу
            <span class="modal-btn-sub">+1000 энергии</span>
        </button>
        <button id="closeModalBtn" class="modal-btn-secondary">Подожду</button>
        <div class="modal-timer">Восстановление: <span id="regenTimer">30с</span> за 1 ⚡</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
